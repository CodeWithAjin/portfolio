<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handoff">
<meta name="description" content="Scan a UPI QR, set the amount, and pay in one tap through your UPI app.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<title>Handoff</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0A0A0B;
    --bg-2: #111113;
    --raised: #18181B;
    --raised-2: #202024;
    --line: rgba(255,255,255,.08);
    --line-2: rgba(255,255,255,.14);
    --ink: #F4F0E8;
    --ink-2: #C9C4BA;
    --muted: #8A867E;
    --gold: #DEBE86;
    --gold-ink: #1B140A;
    --good: #7BD8A5;
    --bad: #FF8F7E;
    --sans: "Manrope", -apple-system, system-ui, sans-serif;
    --serif: "Instrument Serif", "New York", Georgia, serif;
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
    --lift: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.45);
  }
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; overflow: hidden; overscroll-behavior: none;
    background: radial-gradient(120% 60% at 50% -10%, rgba(222,190,134,.10), transparent 60%), var(--bg);
    color: var(--ink); font: 500 16px/1.4 var(--sans);
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
  }
  input { -webkit-user-select: text; user-select: text; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 12px; }

  /* ---------- screens: always exactly one viewport, never scroll ---------- */
  .screen {
    position: fixed; inset: 0; height: 100vh; height: 100dvh;
    display: grid; overflow: hidden;
    padding: calc(var(--st) + 8px) 20px calc(var(--sb) + 14px);
    max-width: 520px; margin: 0 auto;
  }
  .top { display: flex; align-items: center; gap: 10px; min-height: 48px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--raised); display: grid; place-items: center; color: var(--ink-2); flex: none; box-shadow: var(--lift);
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:active { transform: scale(.96); }
  .wordmark { font: italic 400 30px/1 var(--serif); letter-spacing: -.01em; flex: 1; }
  .wordmark i { font-style: normal; color: var(--gold); }

  /* ---------- home ---------- */
  #home { grid-template-rows: auto 1fr auto auto; }
  .hero { display: grid; place-content: center; justify-items: center; gap: clamp(14px, 3dvh, 26px); text-align: center; }
  .hero h1 { margin: 0; font: 400 clamp(34px, 6.4dvh, 46px)/1.02 var(--serif); letter-spacing: -.01em; }
  .hero h1 em { color: var(--gold); }
  .orb {
    position: relative; width: clamp(150px, 26dvh, 210px); aspect-ratio: 1; border-radius: 50%;
    border: 0; padding: 0; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #26262B, #121214 70%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -12px 30px rgba(0,0,0,.6),
      0 0 0 1px rgba(222,190,134,.35), 0 0 0 10px rgba(222,190,134,.05), 0 20px 60px rgba(0,0,0,.6);
    color: var(--gold);
  }
  .orb::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 1px solid rgba(222,190,134,.35); animation: pulse 2.6s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.22); opacity: 0; } }
  .orb:active { transform: scale(.97); }
  .orb svg { width: 34%; height: 34%; }
  .orb span { position: absolute; bottom: 20%; font-size: .74rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); }
  .pills { display: flex; gap: 10px; }
  .pill {
    position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px;
    border-radius: 999px; border: 1px solid var(--line-2); background: var(--raised); font-weight: 700; font-size: .92rem;
    box-shadow: var(--lift); overflow: hidden;
  }
  .pill svg { width: 18px; height: 18px; color: var(--gold); }
  .pill input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .pill:active { transform: scale(.97); }

  .label { font-size: .7rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .recent-row { display: flex; gap: 14px; overflow: hidden; }
  .recent { width: 60px; flex: none; display: grid; justify-items: center; gap: 6px; border: 0; background: none; padding: 0; }
  .recent .av { width: 52px; height: 52px; }
  .recent small { font-size: .74rem; color: var(--ink-2); max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fine { margin: 14px 0 0; text-align: center; color: var(--muted); font-size: .76rem; }
  .fine b { color: var(--gold); font-weight: 700; }
  .install {
    display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 8px 8px 12px;
    border-radius: 16px; background: var(--raised); border: 1px solid var(--line); font-size: .8rem; color: var(--ink-2);
  }
  .install svg { width: 18px; height: 18px; flex: none; color: var(--gold); }
  .install span { flex: 1; }
  .install button { border: 0; background: none; color: var(--muted); width: 36px; height: 36px; font-size: 20px; }

  .av {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font-weight: 800; font-size: .88rem; letter-spacing: .02em; color: var(--gold);
    background: radial-gradient(circle at 30% 25%, #2C2A26, #151516); box-shadow: inset 0 0 0 1px rgba(222,190,134,.35);
  }

  /* ---------- pay ---------- */
  #pay { grid-template-rows: auto minmax(0, 1fr) auto auto; row-gap: clamp(6px, 1.4dvh, 14px); }
  .payee { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .payee-t { min-width: 0; }
  .payee-n { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .payee-i { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: .62rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); flex: none; }
  .badge.shop { border-color: rgba(222,190,134,.45); color: var(--gold); }

  .amount { display: grid; place-content: center; text-align: center; min-height: 0; }
  .amt-line { display: flex; align-items: baseline; justify-content: center; gap: 6px; line-height: 1; }
  .amt-line .cur { font: 400 clamp(30px, 5.5dvh, 44px)/1 var(--serif); color: var(--muted); }
  .amt-line .val { font: 400 clamp(60px, 12dvh, 104px)/1 var(--serif); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .amt-line .val.empty { color: #3A3935; }
  .amt-line .val.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .words { margin-top: 8px; font-size: .84rem; color: var(--muted); min-height: 1.2em; }
  .note { margin-top: 4px; font-size: .78rem; color: var(--gold); min-height: 1.1em; }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(2px, .8dvh, 8px) 10px; }
  .key {
    height: clamp(42px, 7.4dvh, 62px); border: 0; border-radius: 16px; background: transparent;
    font: 600 clamp(22px, 3.4dvh, 28px)/1 var(--sans); color: var(--ink); display: grid; place-items: center;
  }
  .key:active { background: var(--raised-2); }
  .key svg { width: 26px; height: 26px; color: var(--ink-2); }

  .actions { display: grid; gap: clamp(10px, 1.8dvh, 16px); }
  .pay-btn {
    display: flex; align-items: center; gap: 12px; height: clamp(54px, 8.4dvh, 64px); padding: 0 8px;
    border-radius: 20px; color: var(--gold-ink);
    background: linear-gradient(180deg, #EBD3A6 0%, #D7B57A 55%, #C49B5C 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.12), 0 14px 34px rgba(199,158,94,.25);
    font-weight: 800; font-size: 1.04rem;
  }
  .pay-btn .ai { width: 42px; height: 42px; border-radius: 14px; }
  .pay-btn .t { flex: 1; text-align: center; margin-right: 50px; line-height: 1.2; }
  .pay-btn .t small { display: block; font-size: .7rem; font-weight: 700; opacity: .68; letter-spacing: .03em; }
  .pay-btn:active { transform: scale(.985); filter: brightness(.96); }
  .pay-btn[aria-disabled="true"] { filter: grayscale(.85) brightness(.5); box-shadow: none; }

  .others { display: grid; grid-template-columns: auto repeat(5, 1fr); align-items: center; gap: 2px; }
  .others .or { font-size: .66rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding-right: 8px; }
  .other { display: grid; justify-items: center; gap: 5px; border: 0; background: none; padding: 2px 0; position: relative; }
  .other small { font-size: .68rem; font-weight: 700; color: var(--ink-2); }
  .other:active .ai { transform: scale(.92); }
  .other .ok-dot { position: absolute; top: -2px; right: calc(50% - 25px); width: 11px; height: 11px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 2px var(--bg); }

  /* ---------- app tiles: original artwork, brand colours only ---------- */
  .ai {
    width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none;
    font: 800 15px/1 var(--sans); letter-spacing: -.03em; transition: transform .12s;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), 0 4px 12px rgba(0,0,0,.35);
  }
  .ai svg { width: 55%; height: 55%; }
  .ai.cred { background: linear-gradient(150deg, #34343A, #0B0B0D); color: #F4F0E8; font: 400 23px/1 var(--serif); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), 0 4px 12px rgba(0,0,0,.35); }
  .ai.gpay { background: #FFFFFF; color: #1A73E8; }
  .ai.phonepe { background: #5F259F; color: #FFFFFF; }
  .ai.paytm { background: #FFFFFF; color: #00A8E8; font-size: 10.5px; letter-spacing: -.01em; }
  .ai.any { background: var(--raised-2); color: var(--ink-2); font-size: 11px; letter-spacing: .02em; }
  .ai.qr { background: var(--raised-2); color: var(--gold); }

  /* ---------- sheets ---------- */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .2s both; }
  @keyframes fade { from { opacity: 0; } }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 520px; margin: 0 auto;
    max-height: 88dvh; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #1B1B1F, #131315); border-radius: 28px 28px 0 0; border-top: 1px solid var(--line-2);
    padding: 10px 20px calc(var(--sb) + 18px); animation: up .28s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes up { from { transform: translateY(100%); } }
  .grip { width: 38px; height: 5px; border-radius: 9px; background: var(--line-2); margin: 0 auto 14px; flex: none; }
  .sheet h2 { margin: 0 0 4px; font: 400 30px/1.05 var(--serif); }
  .sheet .lead { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
  .sheet .scroll { overflow: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .field input { min-height: 54px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--bg-2); font-size: 1.05rem; font-weight: 600; width: 100%; }
  .field input:focus { outline: none; border-color: var(--gold); }
  .err { color: var(--bad); font-size: .84rem; min-height: 1.2em; margin: -4px 0 8px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px;
    border-radius: 18px; border: 1px solid var(--line-2); background: var(--raised); font-weight: 800; box-shadow: var(--lift);
  }
  .btn svg { width: 20px; height: 20px; }
  .btn.gold { border: 0; color: var(--gold-ink); background: linear-gradient(180deg, #EBD3A6, #C99F60); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 12px 28px rgba(199,158,94,.22); }
  .btn:active { transform: scale(.985); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .outcomes { display: grid; gap: 10px; }
  .outcome { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--line-2); background: var(--raised); font-weight: 700; text-align: left; }
  .outcome i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 15px; flex: none; }
  .outcome.good i { background: rgba(123,216,165,.15); color: var(--good); }
  .outcome.bad i { background: rgba(255,143,126,.13); color: var(--bad); }
  .outcome.skip { border: 0; background: none; justify-content: center; color: var(--muted); min-height: 44px; }

  .qr-wrap { display: grid; justify-items: center; gap: 14px; }
  .qr-wrap img { width: min(230px, 32dvh); aspect-ratio: 1080/1360; height: auto; border-radius: 20px; background: #fff; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
  .qr-steps { margin: 0; color: var(--muted); font-size: .84rem; text-align: center; }
  .qr-steps b { color: var(--ink-2); }

  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .stat { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); font-size: .82rem; font-weight: 700; }
  .stat .ai { width: 26px; height: 26px; border-radius: 8px; font-size: 10px; }
  .stat .ai.cred { font-size: 15px; } .stat .ai.paytm { font-size: 7px; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .log li:last-child { border-bottom: 0; }
  .log .ai { width: 34px; height: 34px; border-radius: 11px; font-size: 12px; }
  .log .ai.cred { font-size: 19px; } .log .ai.paytm { font-size: 9px; }
  .log .t { flex: 1; min-width: 0; }
  .log .t b { display: block; font-size: .92rem; }
  .log .t small { display: block; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .a { text-align: right; font-weight: 800; font-size: .92rem; }
  .log .a small { display: block; font-size: .72rem; font-weight: 700; }
  .log .a .ok { color: var(--good); } .log .a .no { color: var(--bad); }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; margin: 0; }

  /* ---------- camera ---------- */
  .cam { position: fixed; inset: 0; z-index: 50; background: #000; display: grid; }
  .cam video { grid-area: 1/1; width: 100%; height: 100%; object-fit: cover; }
  .cam-ui { grid-area: 1/1; display: grid; grid-template-rows: auto 1fr auto; padding: calc(var(--st) + 10px) 20px calc(var(--sb) + 26px); }
  .cam-top { display: flex; justify-content: space-between; align-items: center; }
  .cam-top b { font: italic 400 26px/1 var(--serif); }
  .frame { place-self: center; width: min(70vw, 290px); aspect-ratio: 1; border-radius: 32px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); position: relative; }
  .frame::before {
    content: ""; position: absolute; inset: 0; border-radius: 32px; border: 2px solid var(--gold);
    -webkit-mask: linear-gradient(#000 0 0) top left / 28% 28% no-repeat, linear-gradient(#000 0 0) top right / 28% 28% no-repeat, linear-gradient(#000 0 0) bottom left / 28% 28% no-repeat, linear-gradient(#000 0 0) bottom right / 28% 28% no-repeat;
    mask: linear-gradient(#000 0 0) top left / 28% 28% no-repeat, linear-gradient(#000 0 0) top right / 28% 28% no-repeat, linear-gradient(#000 0 0) bottom left / 28% 28% no-repeat, linear-gradient(#000 0 0) bottom right / 28% 28% no-repeat;
  }
  .frame::after { content: ""; position: absolute; left: 10%; right: 10%; height: 2px; top: 10%; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: scanline 2.2s ease-in-out infinite alternate; }
  @keyframes scanline { to { top: 90%; } }
  .cam-hint { text-align: center; color: var(--ink-2); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; top: calc(var(--st) + 14px); transform: translateX(-50%); z-index: 70;
    padding: 12px 18px; border-radius: 16px; background: rgba(32,32,36,.97); border: 1px solid var(--line-2);
    font-weight: 700; font-size: .9rem; box-shadow: 0 12px 30px rgba(0,0,0,.5); width: max-content; max-width: calc(100% - 40px); text-align: center;
    animation: drop .25s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes drop { from { transform: translate(-50%, -20px); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-height: 620px) { .words, .fine, .recents { display: none; } }
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section class="screen" id="home" aria-label="Home">
  <header class="top">
    <div class="wordmark" role="img" aria-label="Handoff">hand<i>off</i></div>
    <button class="icon-btn" type="button" data-open-history aria-label="Payment history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
    </button>
  </header>

  <div class="hero">
    <h1>Pay anyone,<br><em>in one tap.</em></h1>
    <button class="orb" id="scanBtn" type="button" aria-label="Scan a UPI QR code">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg>
      <span>Scan</span>
    </button>
    <div class="pills">
      <label class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
        Photo
        <input id="photo" type="file" accept="image/*" aria-label="Pick a photo of a QR code">
      </label>
      <button class="pill" type="button" id="openId">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-4 8"/></svg>
        UPI ID
      </button>
    </div>
  </div>

  <div class="recents" id="recents" hidden>
    <p class="label">Recent</p>
    <div class="recent-row" id="recentRow"></div>
  </div>

  <div>
    <p class="fine">Payments are real. Test with <b>₹1</b>.</p>
    <div class="install" id="install" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>
      <span>Install: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span>
      <button type="button" id="installX" aria-label="Dismiss">×</button>
    </div>
  </div>
</section>

<!-- ================= PAY ================= -->
<section class="screen" id="pay" aria-label="Pay" hidden>
  <header class="top">
    <button class="icon-btn" type="button" id="backHome" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="payee">
      <div class="av" id="pAv" aria-hidden="true"></div>
      <div class="payee-t">
        <div class="payee-n" id="pName"></div>
        <div class="payee-i" id="pId"></div>
      </div>
    </div>
    <span class="badge" id="pKind"></span>
  </header>

  <div class="amount" aria-live="polite">

  $$('#keypad [data-k]').forEach(function (b) {
    var hold = null, cleared = false;
    b.addEventListener('click', function () { if (cleared) { cleared = false; return; } press(b.getAttribute('data-k')); });
    if (b.getAttribute('data-k') === 'del') {
      b.addEventListener('pointerdown', function () { cleared = false; hold = setTimeout(function () { press('clear'); cleared = true; }, 550); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, function () { clearTimeout(hold); }); });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (!$('cam').hidden) stopCam(); else if (sheetOpen) closeSheet(); return; }
    if (st.screen !== 'pay' || sheetOpen || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key) || e.key === '.') { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
  });

  /* ---------- paying ---------- */
  function methodFor(id) {
    if (kind() !== 'personal') return 'direct';
    var direct = st.log.filter(function (e) { return e.appId === id && e.kind === 'personal' && e.method === 'direct'; });
    if (direct.some(function (e) { return e.outcome === 'Paid'; })) return 'direct';
    if (direct.length && APPS[id].open) return 'copy';
    return APPS[id].personal;
  }
  function worked(id) { return st.log.some(function (e) { return e.appId === id && e.outcome === 'Paid' && e.kind === kind(); }); }
  function hrefFor(id) { return methodFor(id) === 'copy' ? openLink(APPS[id], ANDROID) : payLink(APPS[id], query(), ANDROID); }

  function began(id, method) {
    var name = id === 'qr' ? 'QR scan' : APPS[id].name;
    st.pending = {
      appId: id, app: name, method: method, amount: normAmount(st.amount), pa: qr.pa, name: payeeName(), kind: kind(),
      time: new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
      link: method === 'direct' ? payLink(APPS[id], query(), ANDROID) : (method === 'qr' ? 'upi://pay?' + query() : '')
    };
    st.recents = st.recents.filter(function (r) { return r.pa !== qr.pa; });
    st.recents.unshift({ raw: st.raw, name: st.name, pa: qr.pa, label: payeeName() || qr.pa });
    st.recents = st.recents.slice(0, 8);
    save();
  }
  function needAmount(e) {
    if (normAmount(st.amount)) return false;
    if (e) e.preventDefault();
    bump(); toast('Enter an amount first');
    return true;
  }
  function onAppTap(id, e) {
    if (needAmount(e)) return;
    var m = methodFor(id);
    if (m === 'copy') {
      copySync(qr.pa);
      toast('UPI ID copied. Paste it in ' + APPS[id].name + ' and pay ' + fmtINR(st.amount), 4000);
    }
    began(id, m);
    armReturn();
  }
  $('primary').addEventListener('click', function (e) { onAppTap(PRIMARY, e); });

  OTHERS.forEach(function (id) {
    var a = document.createElement('a');
    a.className = 'other'; a.id = 'o-' + id; a.setAttribute('role', 'button');
    a.appendChild(icon(id));
    var s = document.createElement('small'); s.textContent = APPS[id].short; a.appendChild(s);
    a.addEventListener('click', function (e) { onAppTap(id, e); });
    $('others').appendChild(a);
  });
  var qrBtn = document.createElement('button');
  qrBtn.type = 'button'; qrBtn.className = 'other'; qrBtn.id = 'o-qr';
  qrBtn.setAttribute('aria-label', 'Show a QR to scan in any UPI app');
  qrBtn.appendChild(icon('qr'));
  var qs = document.createElement('small'); qs.textContent = 'QR'; qrBtn.appendChild(qs);
  qrBtn.addEventListener('click', function () { if (!needAmount()) openQr(); });
  $('others').appendChild(qrBtn);

  /* return detection -> outcome sheet */
  var wentAway = false, stayT;
  function armReturn() {
    wentAway = false; clearTimeout(stayT);
    stayT = setTimeout(function () { if (st.pending && !wentAway && document.visibilityState === 'visible' && !sheetOpen) askOutcome(true); }, 4000);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { wentAway = true; return; }
    if (st.pending && wentAway && (!sheetOpen || sheetOpen === 't-qr')) setTimeout(function () { askOutcome(false); }, 300);
  });
  function askOutcome(stayed) {
    var p = st.pending; if (!p) return;
    openSheet('t-outcome', function (sh) {
      sh.querySelector('#oTitle').textContent = 'Did ' + fmtINR(p.amount) + ' go through?';
      sh.querySelector('#oLead').textContent = (p.name || p.pa) + ' · via ' + p.app + (stayed ? '. The app may not have opened.' : '');
      $$('[data-o]', sh).forEach(function (b) {
        b.addEventListener('click', function () {
          var o = b.getAttribute('data-o');
          if (o && st.pending) {
            st.pending.outcome = o; st.log.unshift(st.pending);
            if (o === 'Paid') { st.amount = ''; toast('Saved. ' + p.app + ' worked.'); }
            else if (p.method === 'direct' && p.kind === 'personal' && APPS[p.appId] && APPS[p.appId].open && !worked(p.appId)) toast('Next time, ' + p.app + ' will copy the UPI ID instead.', 3400);
          }
          st.pending = null; save(); closeSheet(true); render();
        });
      });
    });
  }

  /* QR sheet */
  var qrBlob = null;
  function openQr() {
    began('qr', 'qr');
    openSheet('t-qr', function (sh) {
      var img = sh.querySelector('#qrImg');
      drawQr(img);
      sh.querySelector('#qrSave').addEventListener('click', function () {
        if (qrBlob && navigator.canShare) {
          var file = new File([qrBlob], 'upi-qr.png', { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(function () {}); return; }
        }
        var a = document.createElement('a'); a.href = img.src; a.download = 'upi-qr.png';
        document.body.appendChild(a); a.click(); a.remove();
        toast('If it didn’t save, press and hold the QR', 3000);
      });
      sh.querySelector('#qrDone').addEventListener('click', function () { closeSheet(true); askOutcome(false); });
    });
  }
  function fit(x, s, w) { s = String(s); if (x.measureText(s).width <= w) return s; while (s.length > 1 && x.measureText(s + '…').width > w) s = s.slice(0, -1); return s + '…'; }
  function drawQr(img) {
    if (!window.qrcode) { toast('QR maker still loading. Try again.'); return; }
    if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    var q = qrcode(0, 'M'); q.addData('upi://pay?' + query()); q.make();
    var n = q.getModuleCount(), W = 1080, H = 1360, c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
    var cell = Math.floor(860 / (n + 8)), size = cell * (n + 8), ox = Math.round((W - size) / 2), oy = 70;
    x.fillStyle = '#0A0A0B';
    for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(ox + (k + 4) * cell, oy + (r + 4) * cell, cell, cell);
    var y = oy + size + 80; x.textAlign = 'center';
    x.font = '400 110px "Instrument Serif", Georgia, serif'; x.fillText(fmtINR(st.amount), W / 2, y);
    x.font = '700 48px Manrope, -apple-system, sans-serif'; x.fillText(fit(x, payeeName() || qr.pa, 920), W / 2, y + 80);
    x.fillStyle = '#6B675F'; x.font = '500 36px Manrope, -apple-system, sans-serif';
    if (payeeName()) x.fillText(fit(x, qr.pa, 920), W / 2, y + 134);
    img.src = c.toDataURL('image/png');
    qrBlob = null; if (c.toBlob) c.toBlob(function (b) { qrBlob = b; }, 'image/png');
  }

  /* history */
  $$('[data-open-history]').forEach(function (b) { b.addEventListener('click', openHistory); });
  function openHistory() {
    openSheet('t-history', function (sh) {
      var stats = sh.querySelector('#stats'), ul = sh.querySelector('#log');
      sh.querySelector('#empty').hidden = st.log.length > 0;
      sh.querySelector('#hActions').hidden = !st.log.length;
      var by = {};
      st.log.forEach(function (e) {
        var b = by[e.appId] = by[e.appId] || [0, 0]; b[1]++; if (e.outcome === 'Paid') b[0]++;
        var li = document.createElement('li');
        li.appendChild(icon(e.appId));
        var t = document.createElement('div'); t.className = 't';
        t.innerHTML = '<b></b><small></small>';
        t.querySelector('b').textContent = e.name || e.pa;
        t.querySelector('small').textContent = e.app + (e.method === 'copy' ? ' (copied ID)' : '') + ' · ' + e.time;
        var a = document.createElement('div'); a.className = 'a';
        a.innerHTML = '<span></span><small></small>';
        a.querySelector('span').textContent = fmtINR(e.amount);
        var sm = a.querySelector('small'); sm.textContent = e.outcome; sm.className = e.outcome === 'Paid' ? 'ok' : 'no';
        li.appendChild(t); li.appendChild(a); ul.appendChild(li);
      });
      Object.keys(by).forEach(function (id) {
        var d = document.createElement('div'); d.className = 'stat';
        d.appendChild(icon(id));
        d.appendChild(document.createTextNode(by[id][0] + '/' + by[id][1] + ' paid'));
        stats.appendChild(d);
      });
      sh.querySelector('#copyLog').addEventListener('click', function () {
        var rows = ['Outcome\tApp\tMethod\tAmount\tPayee\tUPI ID\tType\tTime\tLink'];
        st.log.forEach(function (e) { rows.push([e.outcome, e.app, e.method, e.amount, e.name || '', e.pa, e.kind, e.time, e.link || ''].join('\t')); });
        toast(copySync(rows.join('\n')) ? 'History copied' : 'Couldn’t copy');
      });
      sh.querySelector('#clearLog').addEventListener('click', function () {
        if (confirm('Clear all history?')) { st.log = []; save(); openHistory(); render(); }
      });
    });
  }

  /* ---------- render ---------- */
  function renderHome() {
    var row = $('recentRow'); row.textContent = '';
    $('recents').hidden = !st.recents.length;
    st.recents.slice(0, 5).forEach(function (r) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'recent';
      b.innerHTML = '<span class="av"></span><small></small>';
      b.querySelector('.av').textContent = initials(r.name || (parseQr(r.raw) || {}).pn, r.pa);
      b.querySelector('small').textContent = (r.label || r.pa).split(/[\s@]/)[0];
      b.setAttribute('aria-label', 'Pay ' + (r.label || r.pa));
      b.addEventListener('click', function () { usePayee(r.raw, r.name); });
      row.appendChild(b);
    });
    $('install').hidden = !(IOS && !STANDALONE && !st.noInstall);
  }
  $('installX').addEventListener('click', function () { st.noInstall = true; save(); renderHome(); });

  function renderPay() {
    if (!qr) return;
    var nm = payeeName(), k = kind();
    $('pAv').textContent = initials(nm, qr.pa);
    $('pName').textContent = nm || qr.pa;
    $('pId').textContent = nm ? qr.pa : (qr.typed ? 'UPI ID' : 'No name in QR');
    $('pKind').textContent = k === 'shop' ? 'Merchant' : 'Personal';
    $('pKind').className = 'badge' + (k === 'shop' ? ' shop' : '');

    var a = st.amount, has = !!normAmount(a), v = $('amtVal');
    if (!a) v.textContent = '0';
    else { var i = a.split('.'); v.textContent = Number(i[0] || 0).toLocaleString('en-IN') + (i.length > 1 ? '.' + i[1] : ''); }
    v.classList.toggle('empty', !a);
    $('amtWords').textContent = amountWords(a);
    var note = '';
    if (qr.am && normAmount(a) !== normAmount(qr.am)) note = 'QR asked for ' + fmtINR(qr.am);
    else if (qr.am) note = 'Amount set by the QR';
    $('amtNote').textContent = note;

    var p = $('primary');
    p.setAttribute('aria-disabled', has ? 'false' : 'true');
    if (has) p.href = hrefFor(PRIMARY); else p.removeAttribute('href');
    $('primaryLabel').textContent = has ? 'Pay ' + fmtINR(a) : 'Enter amount';
    $('primarySub').textContent = methodFor(PRIMARY) === 'copy' ? 'Copy ID & open CRED' : 'One tap with CRED' + (worked(PRIMARY) ? ' · worked before' : '');

    OTHERS.forEach(function (id) {
      var el = $('o-' + id);
      if (has) el.href = hrefFor(id); else el.removeAttribute('href');
      el.setAttribute('aria-label', (methodFor(id) === 'copy' ? 'Copy UPI ID and open ' : 'Pay with ') + APPS[id].name);
      var dot = el.querySelector('.ok-dot');
      if (worked(id) && !dot) { dot = document.createElement('span'); dot.className = 'ok-dot'; el.appendChild(dot); }
      if (!worked(id) && dot) dot.remove();
    });
  }

  function render() {
    $('home').hidden = st.screen !== 'home';
    $('pay').hidden = st.screen !== 'pay';
    if (st.screen === 'home') renderHome(); else renderPay();
  }

  render();
  if (st.pending) setTimeout(function () { askOutcome(false); }, 400);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
